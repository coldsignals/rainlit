<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- A call's video before its picture comes: Rainlit's drop with a camera, rippling. -->
  <defs>
    <radialGradient id="fill" cx="0.5" cy="0.64" r="0.66">
      <stop offset="0" stop-color="#fffbf0"/>
      <stop offset="0.3" stop-color="#ffeec4"/>
      <stop offset="0.68" stop-color="#f8c865"/>
      <stop offset="1" stop-color="#f0a640"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="drop" d="M128 29.3C152.4 63.5 186 84.8 186 130A58 58 0 1 1 70 130C70 84.8 103.6 63.5 128 29.3Z"/>
  </defs>
  <g fill="none" stroke="#f5b94a" stroke-width="3">
    <ellipse cx="128" cy="218" rx="24" ry="4" opacity="0">
      <animate attributeName="rx" values="24;104" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="4;15" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="128" cy="218" rx="24" ry="4" opacity="0">
      <animate attributeName="rx" values="24;104" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="4;15" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <use href="#drop" fill="#f5b94a" opacity="0.5" filter="url(#bloom)">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="2.6s" repeatCount="indefinite"/>
  </use>
  <use href="#drop" fill="url(#fill)"/>
  <g fill="#20242e" opacity="0.9">
    <rect x="92" y="120" width="48" height="36" rx="9"/>
    <path d="M144 132L161 121.6C163 120.4 165 121.6 165 124V152C165 154.4 163 155.6 161 154.4L144 144Z"/>
  </g>
</svg>
