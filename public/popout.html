<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="darkreader-lock" />
  <title>Rainlit</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <!-- A camera or screen share popped out of a call into a window of its own. The Rainlit
       window that opened it puts the video in and keeps it up to date (see "Popping a video
       out" in app.js), so this page has no script of its own. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #000; color: #eceaf3;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #pop-ended { position: absolute; margin: 0; padding: 14px 18px; background: #20293a; border: 1px solid #364156; border-radius: 14px; font-size: 15px; }
    .pop-bar {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; align-items: center; gap: 8px;
      opacity: 0; transition: opacity 0.2s;
    }
    body:hover .pop-bar, .pop-bar:focus-within { opacity: 1; }
    #pop-name {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 14px; font-weight: 650; text-shadow: 0 1px 3px #000;
    }
    .pop-bar button {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px;
      background: rgba(14, 18, 28, 0.72); color: #eceaf3;
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px;
      font: inherit; font-size: 13px; font-weight: 650;
      cursor: pointer;
    }
    .pop-bar button:hover { background: rgba(32, 41, 58, 0.92); }
    .pop-bar button[hidden] { display: none; }
  </style>
</head>
<body>
  <video id="pop-video" autoplay playsinline muted></video>
  <p id="pop-ended" hidden></p>
  <div class="pop-bar">
    <span id="pop-name"></span>
    <button id="pop-pin" type="button" hidden>Keep on top</button>
    <button id="pop-full" type="button">Full screen</button>
  </div>
</body>
</html>
