# LiveKit, the media server for voice channels and group calls, when it runs alongside
# Rainlit with Docker (docker-compose.yml, with COMPOSE_PROFILES=voice in .env; see
# SELF-HOSTING.md, step 11). Its API key and secret come from your .env, not from here.

# Rainlit and people's apps reach it through Caddy, at https://your-domain/livekit.
port: 7880

rtc:
  # The sound and video themselves. Let TCP 7881 and UDP 7882 through to this machine
  # (forward them on your router too, on a home connection).
  tcp_port: 7881
  udp_port: 7882
  # Tells people's apps this machine's public address (it asks a STUN server).
  use_external_ip: true

logging:
  level: info
