# Code scanning (CodeQL): GitHub reads Rainlit's code for known kinds of security mistakes (by
# fixed rules, not guesswork), on every push to main, on pull requests, and once a week. What it
# finds is listed under the repository's Security tab, for the people who look after it.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server, the web app, and the Windows app's own code.
          - language: javascript-typescript
          # The Android app's own code.
          - language: java-kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
