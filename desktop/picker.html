<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:" />
  <title>Share your screen</title>
  <style>
    /* Rainlit's typeface, from the app itself rather than Google's servers (SIL Open Font
       License: OFL.txt). */
    @font-face {
      font-family: "Bricolage Grotesque";
      font-weight: 200 800;
      font-display: swap;
      src: url("bricolage-grotesque-latin.woff2") format("woff2");
    }
    :root {
      --night: #151b28; --deep: #0e121c; --dusk: #20293a; --dusk-hi: #2a3448; --line: #364156;
      --mist: #a9b4c8; --text: #eceaf3; --lamp: #f5b94a; --lamp-ink: #22190a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--night); color: var(--text);
      font: 15px/1.45 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    header { padding: 18px 22px 6px; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header p { margin: 2px 0 0; color: var(--mist); font-size: 14px; }
    main { overflow-y: auto; padding: 8px 22px 16px; }
    h2 { margin: 14px 0 10px; color: var(--mist); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .source {
      display: grid; gap: 8px; padding: 8px;
      background: var(--dusk); color: inherit; font: inherit; text-align: left;
      border: 2px solid transparent; border-radius: 12px; cursor: pointer;
    }
    .source:hover { background: var(--dusk-hi); }
    .source:focus-visible { outline: 2px solid var(--mist); outline-offset: 2px; }
    .source[aria-pressed="true"] { border-color: var(--lamp); background: var(--dusk-hi); }
    .thumb { aspect-ratio: 16 / 9; width: 100%; display: block; object-fit: contain; background: #000; border-radius: 7px; }
    .label { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 14px; font-weight: 600; }
    .label img { width: 18px; height: 18px; flex: none; }
    .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note { margin: -4px 0 12px; color: var(--mist); font-size: 13px; transition: color 0.15s; }
    .note.lit { color: var(--lamp); }
    footer {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 22px; background: var(--deep); border-top: 1px solid var(--line);
    }
    .sound { flex: 1; min-width: 240px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .sound input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--lamp); }
    .sound small { display: block; color: var(--mist); font-size: 13px; }
    button.act { border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 700; cursor: pointer; }
    #cancel { background: var(--dusk); color: var(--text); }
    #cancel:hover { background: var(--dusk-hi); }
    #share { background: var(--lamp); color: var(--lamp-ink); }
    #share:disabled { opacity: 0.45; cursor: not-allowed; }
    .empty { color: var(--mist); }
  </style>
</head>
<body>
  <header>
    <h1>Share your screen</h1>
    <p>Pick a whole screen or one window.</p>
  </header>
  <main id="list"><p class="empty">Looking for screens and windows…</p></main>
  <footer>
    <label class="sound" id="sound-row">
      <input id="sound" type="checkbox" checked />
      <span>Share audio
        <small id="sound-what">Everything your computer is playing, except Rainlit itself, so your friend won't hear their own voice.</small>
      </span>
    </label>
    <button id="cancel" class="act" type="button">Cancel</button>
    <button id="share" class="act" type="button" disabled>Share</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
